[project]
name = "commerce-concierge"
version = "0.1.0"
description = "Retail concierge agent combining structured outputs, workflows, A2A, and streaming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.0.0",
    "agent-framework-azure>=1.0.0",
    "agent-framework-a2a>=1.0.0",
    "azure-identity>=1.19",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
functions = [
    "agent-framework-azurefunctions",
]
observability = [
    "azure-monitor-opentelemetry>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
prerelease = "allow"
